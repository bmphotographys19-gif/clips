# ClipRadar AI — despliegue completo en un servidor (VPS).
#   docker compose up -d --build
services:
  caddy:            # HTTPS automático (Let's Encrypt) — necesario para PWA y OAuth de TikTok
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

  api:              # API + panel PWA
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    env_file: .env
    volumes: [data:/data]
    depends_on: [postgres, redis]

  monitor:          # Captura 24/7 + transcripción + detección IA (una sola instancia)
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    command: ["python", "-m", "app.workers.monitor"]
    env_file: .env
    volumes: [data:/data]
    depends_on: [postgres, redis]

  worker:           # Cola de trabajos: revisión visual IA, render 9:16, publicación TikTok
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    command: ["rq", "worker", "render", "publish", "--url", "redis://redis:6379/0"]
    env_file: .env
    volumes: [data:/data]
    depends_on: [postgres, redis]
    # Para renderizar varios clips a la vez: docker compose up -d --scale worker=2

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: clipradar
    volumes: [pg:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]

volumes:
  data:
  pg:
  redis:
  caddy_data:
